 S={me:nm(),mbti:P(MB),trait:P(TR),hobby:P(HOB),tal:R(1,100),pr,fam,$:fam=='貧寒'?R(1500,4000):fam=='普通'?R(4000,12000):R(12000,30000),
 g:50,bs:0,cbT:0,kgT:0,mix:{cb:40,ex:40,bk:20},img:0,soLow:0,reuse:{},h:R(50,90),mo:R(50,90),pa:R(30,80),so:R(40,70),ch:R(20,80),en:80,day:0,lines:3,focus:'study',streak:0,since:0,sport:[],tutor:null,cool:0,partner:null,tries:0,ex:[],log:[],hint:{},hrs:4,todo:[],sx:P(['男','女']),mask:0,hsd:0,lz:1.5,hd:{},exd:Array.from({length:4},()=>{const r=Math.random();return r<.15?0:r<.65?1:r<.9?2:3}),clubs:{},cj:{},db:{},show:null,cv:[],cvs:{},cvj:{},cvd:{},cvr:{},aiPro:0,loveB:0,cvB:0,cvCool:0,cheatOn:0,cheatOk:0,caught:0,sd:0,sdEarly:0,rd:0,so2:0,hg:0,cf:0,ns:0,qc:0,tab:'me'};
 rollLz();fixAl();S.nerd=nm();S.cls=[nm(),nm(),nm(),nm()];S.fr=[1,2,3,4,5].map(()=>({name:nm(),dept:'醫學系',in:R(35,65)}));S.fr.push({name:nm(),dept:P(OD),in:R(35,65)});const g0=R(40,70),r5=()=>Math.max(0,g0+R(-5,5));S.bs=r5();S.cbT=r5();S.kgT=r5();calcSo();calcG();
